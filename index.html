<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>🌾 مزرعة الصحاب — دخول</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="page"><div class="card" style="max-width:430px;margin:6vh auto">
<h1>🌾 مزرعة الصحاب</h1><div class="mut">سجّل حسابك، اعمل عالمك، وادعي صحابك.</div>
<div class="tabs"><button class="btn on" id="tL">دخول</button><button class="btn" id="tR">حساب جديد</button><button class="btn" id="tP">نسيت الباسورد</button></div>
<div id="fU" style="display:none"><input id="un" placeholder="اليوزرنيم (a-z 0-9 _) — اللي صحابك هيضيفوك بيه" maxlength="16" style="direction:ltr"><input id="dn" placeholder="اسمك في اللعبة" maxlength="14"></div>
<div id="fE"><input id="em" type="email" placeholder="الإيميل" style="direction:ltr" autocomplete="email"></div>
<div id="fP"><input id="pw" type="password" placeholder="الباسورد (6 حروف على الأقل)" style="direction:ltr" autocomplete="current-password"></div>
<button class="btn alt" id="go" style="width:100%;margin-top:8px">دخول</button><div id="err" class="err"></div></div></div>
<script type="module" src="js/auth.js"></script></body></html>
